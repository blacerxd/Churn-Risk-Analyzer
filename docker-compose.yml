services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SAMPLE_AUTOLOAD: ${SAMPLE_AUTOLOAD:-extended}
      # Inside the network the bundled Keycloak is reached directly, not through nginx
      OIDC_ISSUER_INTERNAL_URL: ${OIDC_ISSUER_INTERNAL_URL:-http://keycloak:8080/kc/realms/churn}
    volumes:
      - ./sample-data:/sample-data:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

  # Collector for /metrics; UI and API on http://localhost:9090 (not published outside)
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf %s "$$METRICS_TOKEN" > /tmp/metrics-token &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  # SSO provider for the demo: COMPOSE_PROFILES=oidc and OIDC_ENABLED=true in .env.
  # Login is passwordless with a FIDO2 key or passkey, see keycloak/import/churn-realm.json;
  # login pages use the Aéza theme from keycloak/themes/aeza.
  # Dev mode with the embedded database on a volume, so registered keys survive restarts;
  # the realm file is imported only into an empty volume.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    profiles: [oidc]
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_HTTP_RELATIVE_PATH: /kc
      KC_HOSTNAME: ${OIDC_PUBLIC_URL:-http://localhost:8080}/kc
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      # used by placeholders in keycloak/import/churn-realm.json
      OIDC_PUBLIC_URL: ${OIDC_PUBLIC_URL:-http://localhost:8080}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      KEYCLOAK_PROVISIONER_SECRET: ${KEYCLOAK_PROVISIONER_SECRET:-}
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro

volumes:
  pgdata:
  keycloak-data:
  prometheus-data:
