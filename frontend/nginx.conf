# Behind the host nginx with TLS the original scheme comes in X-Forwarded-Proto
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location = /api/v1/events {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        # proxy_set_header here disables inheritance from the server block
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location = /api/v1/auth/login {
        if ($request_method = GET) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend:8000;
    }

    location ~ ^/(api|metrics|health|admin|static)(/|$) {
        proxy_pass http://backend:8000;
    }

    # Keycloak (profile oidc): only login pages, the admin console stays inside.
    # Resolved per request, so nginx starts without the keycloak container.
    location /kc/ {
        return 404;
    }

    location ~ ^/kc/(realms|resources)/ {
        resolver 127.0.0.11 valid=30s;
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
