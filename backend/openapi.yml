openapi: 3.0.3
info:
  title: Churn Risk Analyzer API
  version: 1.0.0
paths:
  /api/v1/admin/recalculations:
    get:
      operationId: api_v1_admin_recalculations_list
      summary: История пересчётов
      parameters:
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
        description: До 100, по умолчанию 25
      tags:
      - administration
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRecalculationList'
          description: ''
  /api/v1/admin/status-events:
    get:
      operationId: api_v1_admin_status_events_list
      description: Копится из разницы между загруженными снимками.
      summary: Журнал смен статусов услуг
      parameters:
      - in: query
        name: customer_id
        schema:
          type: integer
      - in: query
        name: new_status
        schema:
          enum:
          - active
          - suspended
          - prolong_wait
          - deleted
          - blocked
          type: string
          minLength: 1
        description: |-
          * `active` - active
          * `suspended` - suspended
          * `prolong_wait` - prolong_wait
          * `deleted` - deleted
          * `blocked` - blocked
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
        description: До 100, по умолчанию 25
      - in: query
        name: service_id
        schema:
          type: integer
      tags:
      - administration
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStatusEventList'
          description: ''
  /api/v1/admin/users:
    get:
      operationId: api_v1_admin_users_list
      summary: Пользователи панели
      parameters:
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
        description: До 100, по умолчанию 25
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
        description: Часть логина или email
      tags:
      - administration
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
    post:
      operationId: api_v1_admin_users_create
      summary: Создать пользователя
      tags:
      - administration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUser'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/{id}:
    get:
      operationId: api_v1_admin_users_retrieve
      summary: Пользователь
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - administration
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    patch:
      operationId: api_v1_admin_users_partial_update
      description: Блокировка (is_active), права администратора (is_staff, только
        суперпользователь), новый пароль.
      summary: Изменить пользователя
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - administration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUser'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/analytics/churn-chart:
    get:
      operationId: api_v1_analytics_churn_chart_retrieve
      description: 'Факт: сколько услуг перешло в deleted за день. История копится
        из разницы между загруженными снимками, поэтому начинается с первого обнаруженного
        удаления. Прогноз: по услугам, которые истекают в ближайшие `days` дней, сумма
        вероятностей ухода их владельцев. Отсчёт идёт от времени последнего пересчёта.'
      summary: 'График оттока: факт и прогноз'
      parameters:
      - in: query
        name: days
        schema:
          type: integer
          maximum: 90
          minimum: 1
          default: 30
      tags:
      - analytics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChurnChart'
          description: ''
  /api/v1/analytics/summary:
    get:
      operationId: api_v1_analytics_summary_retrieve
      summary: Итоги по портфелю клиентов
      tags:
      - analytics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
          description: ''
  /api/v1/auth/config:
    get:
      operationId: api_v1_auth_config_retrieve
      summary: Доступные способы входа
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
          description: ''
  /api/v1/auth/csrf:
    get:
      operationId: api_v1_auth_csrf_retrieve
      description: Выставляет cookie `csrftoken`. Значение передаётся в заголовке
        `X-CSRFToken` во всех POST/PUT/PATCH.
      summary: Получить CSRF-cookie
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/login:
    post:
      operationId: api_v1_auth_login_create
      summary: Вход по логину и паролю
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          description: Не указан логин или пароль
        '401':
          description: Неверный логин или пароль
        '429':
          description: Слишком много попыток
  /api/v1/auth/logout:
    post:
      operationId: api_v1_auth_logout_create
      summary: Завершение сессии
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '401':
          description: Не выполнен вход
  /api/v1/auth/me:
    get:
      operationId: api_v1_auth_me_retrieve
      summary: Текущий пользователь
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          description: Не выполнен вход
  /api/v1/auth/passkeys:
    get:
      operationId: api_v1_auth_passkeys_retrieve
      description: Есть ли у текущего пользователя учётная запись SSO и какие ключи
        для входа через SSO он добавил.
      summary: Мои ключи доступа (passkey)
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkeys'
          description: ''
  /api/v1/auth/passkeys/{credential_id}:
    delete:
      operationId: api_v1_auth_passkeys_destroy
      summary: Удалить ключ доступа
      parameters:
      - in: path
        name: credential_id
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '404':
          description: Нет такого ключа
  /api/v1/auth/passkeys/setup:
    post:
      operationId: api_v1_auth_passkeys_setup_create
      description: 'Возвращает адрес, по которому браузер уходит в Keycloak: подтвердить
        вход и создать ключ, затем вернуться в профиль. Если учётной записи SSO ещё
        нет (пользователь создан до включения SSO), нужен пароль от панели: после
        проверки учётная запись создаётся.'
      summary: Начать добавление ключа доступа
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeySetup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasskeySetup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasskeySetup'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeySetupResult'
          description: ''
        '400':
          description: Нужен пароль или он неверный
  /api/v1/customers:
    get:
      operationId: customers_list
      summary: Список клиентов с оценкой риска
      parameters:
      - in: query
        name: level
        schema:
          enum:
          - high
          - medium
          - low
          - none
          type: string
          minLength: 1
        description: |-
          * `high` - high
          * `medium` - medium
          * `low` - low
          * `none` - none
      - in: query
        name: ordering
        schema:
          enum:
          - id
          - email
          - balance
          - total_replenished
          - score
          - level
          - expected_loss
          - -id
          - -email
          - -balance
          - -total_replenished
          - -score
          - -level
          - -expected_loss
          type: string
          default: -score
          minLength: 1
        description: |-
          * `id` - id
          * `email` - email
          * `balance` - balance
          * `total_replenished` - total_replenished
          * `score` - score
          * `level` - level
          * `expected_loss` - expected_loss
          * `-id` - -id
          * `-email` - -email
          * `-balance` - -balance
          * `-total_replenished` - -total_replenished
          * `-score` - -score
          * `-level` - -level
          * `-expected_loss` - -expected_loss
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
        description: До 100, по умолчанию 25
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
        description: Часть email, без учёта регистра
      tags:
      - customers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
          description: ''
  /api/v1/customers/{id}:
    get:
      operationId: api_v1_customers_retrieve
      summary: 'Карточка клиента: признаки риска и услуги'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - customers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetail'
          description: ''
  /api/v1/model/settings:
    get:
      operationId: api_v1_model_settings_retrieve
      summary: Действующие настройки модели и схема формы
      tags:
      - model
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSettings'
          description: ''
    patch:
      operationId: api_v1_model_settings_partial_update
      description: 'Частичное изменение: передаются только меняемые поля. После сохранения
        в той же транзакции пересчитываются оценки всех клиентов, подписчики SSE получают
        событие `recalculated`. Ответ — уже действующие настройки.'
      summary: Изменить настройки модели
      tags:
      - model
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedModelSettingsPatch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedModelSettingsPatch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedModelSettingsPatch'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSettings'
          description: ''
        '400':
          description: Ошибки по полям в `errors`, например errors.weights.prolong_wait
  /api/v1/source/snapshot:
    put:
      operationId: api_v1_source_snapshot_update
      description: Полностью заменяет аккаунты, услуги и транзакции и запускает пересчёт
        оценок. Формат снимка описан в docs/api-contract.md. Принимает JSON в теле
        запроса или JSON-файл в поле `file` (multipart/form-data). При ошибке данные
        не меняются.
      summary: Загрузить снимок исходных данных
      tags:
      - source
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SnapshotUpload'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotError'
          description: Снимок не прошёл проверку
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotError'
          description: Слишком большой снимок
  /metrics:
    get:
      operationId: metrics_retrieve
      description: Формат Prometheus text. Значения совпадают с `/api/v1/analytics/summary`.
      summary: Метрики для Prometheus
      tags:
      - metrics
      security:
      - metricsToken: []
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
          description: ''
        '401':
          description: Нет токена или токен неверный
components:
  schemas:
    AdminUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Имя пользователя
          description: Обязательное поле. Не более 150 символов. Только буквы, цифры
            и символы @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          title: Имя
          maxLength: 150
        last_name:
          type: string
          title: Фамилия
          maxLength: 150
        email:
          title: Адрес электронной почты
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        is_active:
          type: boolean
          title: Активный
          description: Отметьте, если пользователь должен считаться активным. Уберите
            эту отметку вместо удаления учётной записи.
        is_staff:
          type: boolean
          title: Статус персонала
          description: Отметьте, если пользователь может входить в административную
            часть сайта.
        is_superuser:
          type: boolean
          readOnly: true
          title: Статус суперпользователя
          description: Указывает, что пользователь имеет все права без явного их назначения.
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Дата регистрации
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Последний вход
        password:
          type: string
          writeOnly: true
          description: Обязателен при создании; при изменении задаёт новый пароль
      required:
      - date_joined
      - id
      - is_superuser
      - last_login
      - username
    AuthConfig:
      type: object
      properties:
        oidc_enabled:
          type: boolean
          description: Показывать ли кнопку «Войти через SSO»
      required:
      - oidc_enabled
    ChurnChart:
      type: object
      properties:
        series:
          type: array
          items:
            $ref: '#/components/schemas/ChurnPoint'
      required:
      - series
    ChurnPoint:
      type: object
      properties:
        date:
          type: string
          format: date
        kind:
          $ref: '#/components/schemas/KindEnum'
        deleted_services:
          type: integer
          description: Только для fact
        expected_non_renewals:
          type: number
          format: double
          description: 'Только для forecast: сумма вероятностей ухода по истекающим
            услугам'
        services_at_risk:
          type: integer
      required:
      - date
      - kind
      - services_at_risk
    CustomerDetail:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        balance_cents:
          type: integer
        bonus_balance_cents:
          type: integer
        bonus_usable:
          type: boolean
        withdraw_balance_cents:
          type: integer
        total_replenished_cents:
          type: integer
        score:
          type: number
          format: double
          nullable: true
        level:
          $ref: '#/components/schemas/LevelEnum'
        top_reason:
          type: string
        expected_loss_cents:
          type: integer
        calculated_at:
          type: string
          format: date-time
          nullable: true
          description: Когда посчитана оценка
        factors:
          type: array
          items:
            $ref: '#/components/schemas/Factor'
        services:
          type: array
          items:
            $ref: '#/components/schemas/CustomerService'
      required:
      - balance_cents
      - bonus_balance_cents
      - bonus_usable
      - calculated_at
      - email
      - expected_loss_cents
      - factors
      - id
      - level
      - score
      - services
      - top_reason
      - total_replenished_cents
      - withdraw_balance_cents
    CustomerPage:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/CustomerRow'
      required:
      - count
      - page
      - page_size
      - results
    CustomerRow:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        balance_cents:
          type: integer
        total_replenished_cents:
          type: integer
        score:
          type: number
          format: double
          nullable: true
        level:
          $ref: '#/components/schemas/LevelEnum'
        top_reason:
          type: string
        expected_loss_cents:
          type: integer
      required:
      - balance_cents
      - email
      - expected_loss_cents
      - id
      - level
      - score
      - top_reason
      - total_replenished_cents
    CustomerService:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
        price_cents:
          type: integer
        payment_term:
          type: string
        autoprolong:
          type: boolean
        expires_at:
          type: string
          format: date-time
        days_to_expiry:
          type: integer
          nullable: true
          description: Целых суток до окончания оплаты, отрицательное — уже истекла
        monthly_equivalent_cents:
          type: integer
        expected_loss_cents:
          type: integer
      required:
      - autoprolong
      - days_to_expiry
      - expected_loss_cents
      - expires_at
      - id
      - monthly_equivalent_cents
      - name
      - payment_term
      - price_cents
      - status
    Factor:
      type: object
      properties:
        key:
          type: string
        title:
          type: string
        value:
          type: number
          format: double
          description: Сила признака от 0 до 1
        weight:
          type: number
          format: double
        contribution:
          type: number
          format: double
          description: Вклад в score
        explanation:
          type: string
      required:
      - contribution
      - explanation
      - key
      - title
      - value
      - weight
    KindEnum:
      enum:
      - fact
      - forecast
      type: string
      description: |-
        * `fact` - fact
        * `forecast` - forecast
    LevelCounts:
      type: object
      properties:
        high:
          type: integer
        medium:
          type: integer
        low:
          type: integer
        none:
          type: integer
      required:
      - high
      - low
      - medium
      - none
    LevelEnum:
      enum:
      - high
      - medium
      - low
      - none
      type: string
      description: |-
        * `high` - high
        * `medium` - medium
        * `low` - low
        * `none` - none
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - password
      - username
    ModelSettings:
      type: object
      properties:
        weights:
          type: object
          additionalProperties:
            type: number
            format: double
        thresholds:
          $ref: '#/components/schemas/Thresholds'
        params:
          type: object
          additionalProperties: {}
        schema:
          allOf:
          - $ref: '#/components/schemas/SettingsSchema'
          readOnly: true
      required:
      - params
      - schema
      - thresholds
      - weights
    PaginatedAdminUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
    PaginatedRecalculationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Recalculation'
    PaginatedStatusEventList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/StatusEvent'
    Passkey:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
          description: Название, которое пользователь дал ключу при создании
        created_at:
          type: string
          format: date-time
          nullable: true
      required:
      - created_at
      - id
      - label
    PasskeySetup:
      type: object
      properties:
        password:
          type: string
          description: Пароль от панели, если учётной записи SSO ещё нет
    PasskeySetupResult:
      type: object
      properties:
        url:
          type: string
          description: Куда перейти браузеру
      required:
      - url
    Passkeys:
      type: object
      properties:
        sso_enabled:
          type: boolean
          description: Включён ли вход через SSO на сервере
        sso_account:
          type: boolean
          description: Есть ли у пользователя учётная запись в SSO
        passkeys:
          type: array
          items:
            $ref: '#/components/schemas/Passkey'
      required:
      - passkeys
      - sso_account
      - sso_enabled
    PatchedAdminUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Имя пользователя
          description: Обязательное поле. Не более 150 символов. Только буквы, цифры
            и символы @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          title: Имя
          maxLength: 150
        last_name:
          type: string
          title: Фамилия
          maxLength: 150
        email:
          title: Адрес электронной почты
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        is_active:
          type: boolean
          title: Активный
          description: Отметьте, если пользователь должен считаться активным. Уберите
            эту отметку вместо удаления учётной записи.
        is_staff:
          type: boolean
          title: Статус персонала
          description: Отметьте, если пользователь может входить в административную
            часть сайта.
        is_superuser:
          type: boolean
          readOnly: true
          title: Статус суперпользователя
          description: Указывает, что пользователь имеет все права без явного их назначения.
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Дата регистрации
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Последний вход
        password:
          type: string
          writeOnly: true
          description: Обязателен при создании; при изменении задаёт новый пароль
    PatchedModelSettingsPatch:
      type: object
      properties:
        weights:
          type: object
          additionalProperties:
            type: number
            format: double
        thresholds:
          type: object
          additionalProperties:
            type: number
            format: double
        params:
          type: object
          additionalProperties: {}
    Recalculation:
      type: object
      properties:
        id:
          type: integer
        reason:
          type: string
          description: snapshot или settings
        calculated_at:
          type: string
          format: date-time
        duration_seconds:
          type: number
          format: double
        customers_total:
          type: integer
        by_level:
          $ref: '#/components/schemas/SnapshotLevels'
        score_avg:
          type: number
          format: double
          nullable: true
        services_at_risk:
          type: integer
        revenue_at_risk_cents:
          type: integer
        expected_loss_cents:
          type: integer
      required:
      - by_level
      - calculated_at
      - customers_total
      - duration_seconds
      - expected_loss_cents
      - id
      - reason
      - revenue_at_risk_cents
      - score_avg
      - services_at_risk
    SettingsField:
      type: object
      properties:
        key:
          type: string
        title:
          type: string
        description:
          type: string
        type:
          $ref: '#/components/schemas/TypeEnum'
        default: {}
        min:
          type: number
          format: double
        max:
          type: number
          format: double
      required:
      - default
      - description
      - key
      - title
      - type
    SettingsSchema:
      type: object
      properties:
        weights:
          type: array
          items:
            $ref: '#/components/schemas/SettingsField'
        thresholds:
          type: array
          items:
            $ref: '#/components/schemas/SettingsField'
        params:
          type: array
          items:
            $ref: '#/components/schemas/SettingsField'
      required:
      - params
      - thresholds
      - weights
    SnapshotError:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotErrorItem'
        errors_total:
          type: integer
      required:
      - code
      - detail
    SnapshotErrorItem:
      type: object
      properties:
        path:
          type: string
          description: Путь к полю в исходном JSON, например services[3].ownerId
        message:
          type: string
      required:
      - message
      - path
    SnapshotLevels:
      type: object
      properties:
        high:
          type: integer
        medium:
          type: integer
        low:
          type: integer
        none:
          type: integer
      required:
      - high
      - low
      - medium
      - none
    SnapshotResult:
      type: object
      properties:
        accounts:
          type: integer
        services:
          type: integer
        transactions:
          type: integer
        status_changes:
          type: integer
          description: Сколько услуг сменили статус по сравнению с прошлым снимком
        imported_at:
          type: string
          format: date-time
        recalculated_at:
          type: string
          format: date-time
          nullable: true
      required:
      - accounts
      - imported_at
      - recalculated_at
      - services
      - status_changes
      - transactions
    SnapshotUpload:
      type: object
      properties:
        file:
          type: string
          format: uri
          description: JSON-файл снимка
      required:
      - file
    StatusEvent:
      type: object
      properties:
        id:
          type: integer
        service_id:
          type: integer
        customer_id:
          type: integer
        old_status:
          type: string
        new_status:
          type: string
        detected_at:
          type: string
          format: date-time
      required:
      - customer_id
      - detected_at
      - id
      - new_status
      - old_status
      - service_id
    Summary:
      type: object
      properties:
        calculated_at:
          type: string
          format: date-time
          nullable: true
          description: null до первого пересчёта
        customers_total:
          type: integer
        by_level:
          $ref: '#/components/schemas/LevelCounts'
        services_at_risk:
          type: integer
        revenue_at_risk_cents:
          type: integer
        expected_loss_cents:
          type: integer
        explanation:
          type: string
          description: Как считается ожидаемая потеря
      required:
      - by_level
      - calculated_at
      - customers_total
      - expected_loss_cents
      - explanation
      - revenue_at_risk_cents
      - services_at_risk
    Thresholds:
      type: object
      properties:
        medium:
          type: number
          format: double
        high:
          type: number
          format: double
      required:
      - high
      - medium
    TypeEnum:
      enum:
      - number
      - integer
      - boolean
      type: string
      description: |-
        * `number` - number
        * `integer` - integer
        * `boolean` - boolean
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Имя пользователя
          description: Обязательное поле. Не более 150 символов. Только буквы, цифры
            и символы @/./+/-/_.
        first_name:
          type: string
          readOnly: true
          title: Имя
        last_name:
          type: string
          readOnly: true
          title: Фамилия
        email:
          type: string
          format: email
          readOnly: true
          title: Адрес электронной почты
        is_staff:
          type: boolean
          readOnly: true
          title: Статус персонала
          description: Отметьте, если пользователь может входить в административную
            часть сайта.
        is_superuser:
          type: boolean
          readOnly: true
          title: Статус суперпользователя
          description: Указывает, что пользователь имеет все права без явного их назначения.
      required:
      - email
      - first_name
      - id
      - is_staff
      - is_superuser
      - last_name
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    metricsToken:
      type: http
      scheme: bearer
      description: Значение METRICS_TOKEN из .env
