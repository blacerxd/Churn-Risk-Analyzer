name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: churn
          POSTGRES_USER: churn
          POSTGRES_PASSWORD: churn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U churn"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-secret
      POSTGRES_DB: churn
      POSTGRES_USER: churn
      POSTGRES_PASSWORD: churn
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # env_file: .env is required by compose, real values live only on the server
      - run: cp .env.example .env
      - run: docker compose config --quiet

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, compose]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Deploy
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            set -e
            cd /opt/churn-risk-analyzer
            git fetch --quiet origin main
            git reset --hard origin/main
            docker compose up -d --build --remove-orphans
            docker image prune -f
          '
      - name: Healthcheck
        run: |
          for i in $(seq 1 30); do
            curl -sfL http://${{ secrets.DEPLOY_HOST }}/health && exit 0
            sleep 2
          done
          exit 1
